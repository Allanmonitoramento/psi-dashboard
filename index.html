<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Execução Orçamentária — PSI BR-L1542</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #eef2f7;
  color: #1a2b3c;
  padding: 28px 20px 48px;
}
h1 { text-align:center; font-size:1.25rem; font-weight:700; color:#1a3a5c; margin-bottom:4px; }
.subtitle { text-align:center; font-size:0.8rem; color:#6080a0; margin-bottom:28px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  gap: 22px;
  max-width: 1120px;
  margin: 0 auto;
}
.card { background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,0.08); }
.card-header { padding:11px 18px; font-weight:700; font-size:1rem; letter-spacing:0.08em; color:#fff; text-align:center; }
.interpi .card-header { background:#1a5f9e; }
.saf     .card-header { background:#2e7d32; }
.semarh  .card-header { background:#6a1b9a; }
.seplan  .card-header { background:#b45309; }
.section-label {
  font-size:0.72rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
  color:#8899aa; padding:10px 16px 4px; border-top:1px solid #eef2f7;
}
.section-label:first-of-type { border-top:none; padding-top:14px; }
.chart-wrap { padding:4px 16px 8px; position:relative; height:220px; }
.deficit-box {
  margin:4px 14px 10px; padding:10px 14px; border-radius:8px;
  background:#fff4f2; border-left:4px solid #cc3300;
  display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;
}
.deficit-box .lbl  { font-size:0.75rem; font-weight:700; color:#cc3300; text-transform:uppercase; letter-spacing:0.05em; }
.deficit-box .val  { font-size:0.95rem; font-weight:700; color:#991100; }
.deficit-box .pct-wrap { font-size:0.72rem; color:#bb5500; }
.def-line { margin:0 16px 10px; font-size:0.74rem; color:#c0392b; }
.def-line b { color:#a93226; font-weight:600; }
.saldo-box { margin:4px 14px 10px; padding:10px 14px; border-radius:8px; background:#eef4fb; border-left:4px solid #1a5f9e;
  display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; }
.saldo-box { display:block; }
.saldo-box .srow { display:flex; justify-content:space-between; gap:10px; font-size:0.76rem; color:#4a6078; padding:2px 0; }
.saldo-box .srow.total { border-top:1px solid #c5d6ea; margin-top:4px; padding-top:6px; font-size:0.85rem; font-weight:700; color:#12406b; }
.saldo-box .lbl { font-size:0.75rem; font-weight:700; color:#1a5f9e; text-transform:uppercase; letter-spacing:0.05em; }
.saldo-box .sub { font-size:0.68rem; color:#6b819a; margin-top:2px; }
.saldo-box .val { font-size:0.95rem; font-weight:700; color:#12406b; }
.dist-note { margin:-6px 16px 14px; font-size:0.68rem; color:#7a8899; text-align:right; }
.future-row { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:4px 14px 14px; }
.plan-fut { padding:9px 10px; border-radius:8px; background:#f5f8ff; border-left:4px solid #6688bb; }
.plan-fut .lbl  { font-size:0.7rem; font-weight:700; color:#336699; text-transform:uppercase; letter-spacing:0.04em; }
.plan-fut .val  { font-size:0.82rem; font-weight:700; color:#1a3a5c; margin-top:3px; }
.plan-fut .note { font-size:0.65rem; color:#7799bb; }
.kpi-row { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; max-width:1100px; margin:0 auto 6px; }
@media (max-width:760px){ .kpi-row { grid-template-columns:1fr; } }
.kpi { background:#fff; border-radius:10px; padding:14px 18px; box-shadow:0 1px 4px rgba(0,0,0,0.08); border-top:4px solid #1a3a5c; }
.kpi.exec { border-top-color:#2e7d32; } .kpi.saldo { border-top-color:#b45309; }
.kpi .k-lbl { font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:#6b819a; }
.kpi .k-brl { font-size:1.35rem; font-weight:700; color:#1a2b3c; margin-top:4px; }
.kpi .k-usd { font-size:0.9rem; color:#4a6078; margin-top:2px; }
.kpi .k-pct { font-size:0.7rem; color:#8899aa; margin-top:4px; }
.kpi-fx { text-align:center; font-size:0.7rem; color:#8899aa; margin:0 auto 20px; }
.legend { display:flex; justify-content:center; gap:20px; margin:0 auto 22px; flex-wrap:wrap; }
.legend-item { display:flex; align-items:center; gap:6px; font-size:0.8rem; color:#445566; }
.legend-dot { width:14px; height:14px; border-radius:3px; }
.dot-plan { background:#4a90c8; }
.dot-exec { background:#4caf50; }
#loading {
  text-align:center; padding:60px 20px; font-size:0.95rem; color:#6080a0;
}
#loading .spinner {
  width:36px; height:36px; border:4px solid #d0dce8; border-top-color:#1a5f9e;
  border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
#error-msg { text-align:center; color:#cc3300; padding:40px 20px; font-size:0.9rem; }
</style>
</head>
<body>

<h1>Execução Orçamentária por Secretaria</h1>
<p class="subtitle" id="subtitle">Projeto PSI BR-L1542 &nbsp;|&nbsp; Carregando dados…</p>

<div id="loading">
  <div class="spinner"></div>
  Buscando dados da planilha…
</div>
<div id="error-msg" style="display:none;"></div>

<div id="content" style="display:none;">
  <div class="kpi-row" id="kpi-row"></div>
  <div class="kpi-fx" id="kpi-fx"></div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot dot-plan"></div> Planejado</div>
    <div class="legend-item"><div class="legend-dot dot-exec"></div> Executado</div>
  </div>

  <!-- BASELINE -->
  <div style="max-width:1120px;margin:0 auto 28px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.08);">
    <div style="padding:11px 20px;background:#1a3a5c;color:#fff;font-weight:700;font-size:0.95rem;letter-spacing:0.05em;">Baseline — Planejado Original (desenho do projeto) vs. Planejado Ajustado (após reajustes)</div>
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:0.85rem;">
        <thead>
          <tr style="background:#f7f9fc;">
            <th style="padding:9px 16px;text-align:left;font-weight:700;color:#445566;border-bottom:2px solid #e0e8f0;">Secretaria</th>
            <th style="padding:9px 16px;text-align:right;font-weight:700;color:#445566;border-bottom:2px solid #e0e8f0;">Planejado Original</th>
            <th style="padding:9px 16px;text-align:right;font-weight:700;color:#445566;border-bottom:2px solid #e0e8f0;">Planejado Ajustado</th>
            <th style="padding:9px 16px;text-align:right;font-weight:700;color:#445566;border-bottom:2px solid #e0e8f0;">Diferença</th>
            <th style="padding:9px 16px;text-align:left;font-weight:700;color:#445566;border-bottom:2px solid #e0e8f0;">Situação</th>
          </tr>
        </thead>
        <tbody id="baseline-tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="grid" id="main-grid"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script>
// ============================================================
// ALTERE APENAS ESTA URL ao republicar o Apps Script
// ============================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbx02qkJqUf9Y3-nfwuLfGoiochoEYWtDYAa57nwVQhmLF8-FSjHrKoiShMu7ILftvLF/exec';
// ============================================================

const META = {
  interpi: { label:'INTERPI', cls:'interpi', accent:'#1a5f9e' },
  saf:     { label:'SAF',     cls:'saf',     accent:'#2e7d32' },
  semarh:  { label:'SEMARH',  cls:'semarh',  accent:'#6a1b9a' },
  seplan:  { label:'SEPLAN',  cls:'seplan',  accent:'#b45309' },
};

function brl(v) {
  return v.toLocaleString('pt-BR', { style:'currency', currency:'BRL', minimumFractionDigits:2 });
}
function abbr(v) {
  if (v >= 1e6) return (v/1e6).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'Mi';
  if (v >= 1e3) return (v/1e3).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0})+'K';
  return v ? v.toLocaleString('pt-BR') : 'R$ 0';
}

function buildCard(key, rows, base) {
  const meta     = META[key];
  const rows2426 = rows.filter(r => r.ano <= 2026);
  const futRows  = rows.filter(r => r.ano >= 2027);

  const totalPlan = rows2426.reduce((s,r) => s + r.plan, 0);
  const totalExec = rows2426.reduce((s,r) => s + (r.exec || 0), 0);
  const deficit   = totalPlan - totalExec;
  const defPct    = (deficit / totalPlan * 100).toFixed(1);
  const totalAtual = base && base.atual ? base.atual : rows.reduce((s,r) => s + r.plan, 0);
  const saldo      = totalAtual - totalExec;
  const futTotal   = futRows.reduce((s,r) => s + r.plan, 0);
  const difDist    = saldo - futTotal;
  const distNote   = Math.abs(difDist) < 1
    ? 'Saldo integralmente distribuído entre 2027 e 2029'
    : (difDist > 0 ? `Falta distribuir ${brl(difDist)}` : `Distribuído acima do saldo em ${brl(-difDist)}`);

  const card = document.createElement('div');
  card.className = `card ${meta.cls}`;

  const futHTML = futRows.map(r => `
    <div class="plan-fut">
      <div class="lbl">${r.ano}</div>
      <div class="val">${abbr(r.plan)}</div>
      <div class="note">${brl(r.plan)}</div>
    </div>`).join('');

  card.innerHTML = `
    <div class="card-header">${meta.label}</div>
    <div class="section-label">Planejado vs. Executado — 2024 a 2026</div>
    <div class="chart-wrap"><canvas id="chart-${key}"></canvas></div>
    <div class="def-line">Déficit acumulado 2024–2026: <b>${brl(deficit)}</b> (${defPct}% do planejado)</div>
    <div class="section-label">Saldo para os próximos exercícios</div>
    <div class="saldo-box">
      <div class="srow"><span>Planejado ajustado da secretaria</span><span>${brl(totalAtual)}</span></div>
      <div class="srow"><span>(−) Já executado de 2024 a 2026</span><span>${brl(totalExec)}</span></div>
      <div class="srow total"><span>(=) Saldo a executar de 2027 a 2029</span><span>${brl(saldo)}</span></div>
    </div>
    <div class="section-label">Previsto — exercícios futuros</div>
    <div class="future-row">${futHTML}</div>
    <div class="dist-note">${distNote}</div>`;

  document.getElementById('main-grid').appendChild(card);

  new Chart(document.getElementById(`chart-${key}`), {
    plugins: [ChartDataLabels],
    type: 'bar',
    data: {
      labels: rows2426.map(r => String(r.ano)),
      datasets: [
        {
          label: 'Planejado',
          data: rows2426.map(r => r.plan),
          backgroundColor: 'rgba(74,144,200,0.80)',
          borderColor: '#2a70b0', borderWidth:1.5, borderRadius:4,
        },
        {
          label: 'Executado',
          data: rows2426.map(r => r.exec || 0),
          backgroundColor: 'rgba(76,175,80,0.80)',
          borderColor: '#2e7d32', borderWidth:1.5, borderRadius:4,
        },
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      animations: false,
      transitions: { active: { animation: { duration: 0 } } },
      plugins: {
        legend: { display:false },
        datalabels: {
          anchor:'end', align:'end', offset:2,
          font:{ size:9, weight:'700' }, color:'#223344',
          formatter: v => abbr(v)
        },
        tooltip: {
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: ${brl(ctx.raw)}`,
            afterLabel: ctx => {
              if (ctx.datasetIndex === 1) {
                const plan = rows2426[ctx.dataIndex].plan;
                return ` → ${(ctx.raw / plan * 100).toFixed(1)}% do planejado`;
              }
            }
          }
        }
      },
      scales: {
        x: { grid:{ display:false }, ticks:{ font:{ size:11 } } },
        y: {
          ticks: {
            font:{ size:10 },
            callback: v => v>=1e6 ? (v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:0})+'Mi' : (v/1e3).toFixed(0)+'K'
          },
          grid: { color:'#eef2f7' }
        }
      }
    }
  });
}

function buildBaseline(baseline) {
  const tbody = document.getElementById('baseline-tbody');
  tbody.innerHTML = '';
  Object.entries(baseline).forEach(([key, b]) => {
    const meta = META[key];
    const diff = b.atual - b.original;
    const isZero = Math.abs(diff) < 0.01;
    const diffColor = isZero ? '#6699aa' : '#b45309';
    const pct = (diff / b.original * 100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
    const badge = isZero
      ? `<span style="background:#eef4ee;color:#2e7d32;font-size:0.72rem;font-weight:700;padding:2px 8px;border-radius:12px;">Sem alteração</span>`
      : `<span style="background:#fff6e8;color:#b45309;font-size:0.72rem;font-weight:700;padding:2px 8px;border-radius:12px;">Reajustado ${diff>0?'+':''}${pct}%</span>`;
    const tr = document.createElement('tr');
    tr.style.borderBottom = '1px solid #eef2f7';
    tr.innerHTML = `
      <td style="padding:10px 16px;">
        <span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${meta.accent};margin-right:7px;"></span>
        <strong>${meta.label}</strong>
      </td>
      <td style="padding:10px 16px;text-align:right;color:#334455;">${brl(b.original)}</td>
      <td style="padding:10px 16px;text-align:right;color:#334455;font-weight:${isZero?'400':'700'}">${brl(b.atual)}</td>
      <td style="padding:10px 16px;text-align:right;font-weight:700;color:${diffColor};">${isZero ? '—' : (diff>0?'+':'')+brl(diff)}</td>
      <td style="padding:10px 16px;">${badge}</td>`;
    tbody.appendChild(tr);
  });
}

function usd(v) {
  return v.toLocaleString('pt-BR', { style:'currency', currency:'USD', minimumFractionDigits:2 }).replace('US$','US$ ');
}
const PROJETO_USD = 147500000; // valor do contrato BR-L1542 em US$

const COTACAO_PADRAO = 5.50; // usada se a planilha não informar a cotação

function buildKPIs(data) {
  const rate = Number(data.cotacao) > 0 ? Number(data.cotacao) : COTACAO_PADRAO;
  let gasto = 0;
  ['interpi','saf','semarh','seplan'].forEach(k => {
    gasto += (data[k]||[]).filter(r=>r.ano<=2026).reduce((s,r)=>s+(r.exec||0),0);
  });
  const gastoUSD = gasto / rate;
  const saldoUSD = PROJETO_USD - gastoUSD;
  const pct = v => v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
  document.getElementById('kpi-row').innerHTML = `
    <div class="kpi"><div class="k-lbl">Valor contratado</div>
      <div class="k-brl">${usd(PROJETO_USD)}</div><div class="k-usd">${brl(PROJETO_USD*rate)}</div><div class="k-pct">Valor do contrato BR-L1542</div></div>
    <div class="kpi exec"><div class="k-lbl">Total executado (2024–2026)</div>
      <div class="k-brl">${brl(gasto)}</div><div class="k-usd">${usd(gastoUSD)}</div><div class="k-pct">${pct(gastoUSD/PROJETO_USD*100)}% do valor contratado</div></div>
    <div class="kpi saldo"><div class="k-lbl">Saldo disponível</div>
      <div class="k-brl">${usd(saldoUSD)}</div><div class="k-usd">${brl(saldoUSD*rate)}</div><div class="k-pct">${pct(saldoUSD/PROJETO_USD*100)}% do valor contratado</div></div>`;
  document.getElementById('kpi-fx').innerHTML = `Cotação fixa adotada no painel: US$ 1,00 = ${brl(rate)}`;
}

fetch(API_URL)
  .then(r => r.json())
  .then(data => {
    const dt = data.atualizado
      ? `Dados atualizados até <strong>${String(data.atualizado).includes('/') ? data.atualizado : new Date(data.atualizado).toLocaleDateString('pt-BR')}</strong>`
      : 'Projeto PSI BR-L1542';
    document.getElementById('subtitle').innerHTML = `Projeto PSI BR-L1542 &nbsp;|&nbsp; ${dt}`;

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    if (data.baseline) buildBaseline(data.baseline);
    buildKPIs(data);
    ['interpi','saf','semarh','seplan'].forEach(k => {
      if (data[k]) buildCard(k, data[k], (data.baseline||{})[k]);
    });
  })
  .catch(err => {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-msg').style.display = 'block';
    document.getElementById('error-msg').innerHTML =
      `⚠️ Não foi possível carregar os dados da planilha.<br>
       <small style="color:#888;">${err.message}</small><br><br>
       <small>Verifique se o Apps Script está publicado como <strong>App da Web</strong> com acesso <strong>Qualquer pessoa</strong>.</small>`;
  });
</script>
</body>
</html>
